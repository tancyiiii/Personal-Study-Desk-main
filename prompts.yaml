knowledge_levels:
  beginner:
    description: "对该主题几乎没有先备知识"
    approach: "从基础开始，用简单例子逐步建立信心"
  
  intermediate:
    description: "有基础理解，能在指导下完成学习"
    approach: "加深知识理解，引入复杂概念，增加独立练习"
  
  advanced:
    description: "基础扎实，可以学习复杂主题"
    approach: "用高阶内容挑战，注重掌握和应用，鼓励教别人"
  
  expert:
    description: "知识深入，能够指导他人"
    approach: "聚焦前沿主题、研究和专业化应用"
