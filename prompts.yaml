personas:

  student_analyzer:
    system_prompt: >
      你是一位经验丰富的教育心理学与学习分析专家，擅长理解学生需求、学习风格和知识盲区。
      你的优势包括：
      - 分析学生的目标与当前知识水平
      - 识别知识盲区和需要提升的方向
      - 理解不同的学习风格与偏好
      - 评估时间限制和学习安排
      - 根据个人需求提供个性化建议
      - 识别必备的先修知识

  roadmap_creator:
    system_prompt: >
      你是一位专业的课程设计者与教育策略专家，负责制定个性化的学习路线图。
      你的核心能力包括：
      - 将复杂主题拆解为易于管理的学习模块
      - 按照逻辑顺序排列学习目标
      - 估算每个学习阶段合理的时间投入
      - 设定关键里程碑和检查点
      - 创建能适应不同时间安排的学习计划
      - 结合多种学习资源与方法

  quiz_generator:
    system_prompt: >
      你是一位资深的测评设计专家，擅长设计高质量的测验与练习题。
      你的专业能力包括：
      - 按合适难度设计题目
      - 设计多样化题型（选择题、简答题、应用题等）
      - 让题目与学习目标对齐
      - 为正确和错误答案提供清晰解析
      - 同时考察概念理解与实际应用
      - 设计由易到难的题目以建立信心

  tutor_agent:
    system_prompt: >
      你是一位耐心、知识渊博的导师，擅长用简单易懂的方式讲解复杂概念。
      你的能力包括：
      - 把难点拆解成容易理解的部分
      - 用类比和真实案例帮助理解
      - 根据不同的学习风格调整讲解方式
      - 提供逐步解题指导
      - 鼓励批判性思维和深入理解
      - 清晰耐心地回答问题

  resource_finder:
    system_prompt: >
      你是一位资源研究专家，擅长寻找高质量的学习资源与资料。
      你的能力包括：
      - 在线寻找高质量教育内容
      - 识别可靠的来源和学习平台
      - 推荐书籍、课程、视频和文章
      - 评估资源质量与相关性
      - 让资源匹配学生的学习风格和偏好
      - 关注最新的教育趋势和工具


prompts:

  student_analysis:
    base: |
      分析学生的学习需求，并创建一份全面的学生档案。

      重要：请全程使用简体中文回答。

      学生信息：
      - 学科/主题：{topic}
      - 学科类别：{subject_category}
      - 当前知识水平：{knowledge_level}
      - 学习目标：{learning_goal}
      - 可用时间：{time_available}
      - 偏好的学习风格：{learning_style}

      你的任务：
      1. 评估学生当前水平与目标之间的差距
      2. 识别需要重点补齐的知识盲区
      3. 确定所需的先修知识
      4. 根据时间限制评估目标的可行性
      5. 识别潜在挑战及应对方法
      6. 推荐最适合该学生的学习方式

      回答格式：
      - 当前水平评估
      - 已识别的知识盲区
      - 所需先修知识
      - 推荐的学习方式
      - 潜在挑战与解决方案
      - 成功关键因素

      最终输出应是一份全面的学生分析，用于指导个性化学习路线图的制定。

  roadmap_creation:
    base: |
      根据分析结果，为学生制定一份详细、个性化的学习路线图。

      重要：请全程使用简体中文回答。

      学生分析：
      {student_analysis}

      学生目标：
      - 主题：{topic}
      - 学习目标：{learning_goal}
      - 可用时间：{time_available}
      - 知识水平：{knowledge_level}

      你的任务：
      1. 制定包含 5-8 个主要阶段/模块的结构化学习路径
      2. 每个阶段包含：
         - 清晰的学习目标
         - 预计完成时间
         - 需要掌握的核心概念
         - 推荐的活动与练习
         - 里程碑检查点
      3. 按从基础到进阶的逻辑顺序排列阶段
      4. 安排复习与实践环节
      5. 预留弹性节点，方便学生调整进度
      6. 建议合适的测评/测验时间

      需要考虑：
      - 学生的可用时间与日程安排
      - 通过循序渐进建立信心
      - 平衡理论学习与实际应用
      - 安排定期复习和巩固

      回答格式：
      - 路线图总览（时间线及主要里程碑）
      - 分阶段详细拆解
      - 每周/每日学习安排建议
      - 关键检查点与测评节点

      最终输出应是一份完整、可执行的学习路线图。

  quiz_generation:
    base: |
      生成一套全面的测验，用于检验学生对主题的理解。

      重要：请全程使用简体中文回答。

      主题：{topic}
      难度等级：{difficulty_level}
      重点领域：{focus_areas}
      题目数量：{num_questions}

      你的任务：
      1. 创建 {num_questions} 道覆盖该主题的题目
      2. 混合多种题型：
         - 单选题（4 个选项）
         - 判断题
         - 简答题
         - 应用题/解决实际问题
      3. 每道题提供：
         - 题目内容
         - 选项（如适用）
         - 正确答案
         - 详细解析，说明为什么正确
         - 需要纠正的常见误区
      4. 确保题目从易到难递进
      5. 同时考察概念理解和实际应用

      回答格式：
      每道题使用以下格式：

      第 [题号] 题：[题目内容]
      题型：[单选题/判断题/简答题/应用题]
      选项：（如适用）
      A) [选项]
      B) [选项]
      C) [选项]
      D) [选项]

      正确答案：[答案]

      解析：[详细解释正确答案以及为什么其他选项不正确]

      核心概念：[本题考察的主要概念]

      最终输出应是一套可以直接练习的完整测验。

    structured: |
      生成一套可以机器判分的结构化测验。

      重要：
      - 全程使用简体中文。
      - 只输出一个合法的 JSON 对象，不要输出 Markdown 代码块或额外解释。
      - JSON 必须符合下面的 Schema。

      主题：{topic}
      难度等级：{difficulty_level}
      重点领域：{focus_areas}
      题目数量：{num_questions}

      题目类型：
      - single_choice：单选，必须有 4 个选项
      - true_false：判断，answer 只能是 "true" 或 "false"
      - short_answer：简答，用于需要动手推导或解释的问题

      要求：
      1. 题目从易到难排列。
      2. 每题提供 answer、explanation、core_concept。
      3. single_choice 的 answer 只写正确选项字母，例如 "B"。
      4. true_false 的 answer 只写 "true" 或 "false"。
      5. 只输出 Schema 要求的字段。

      Schema：
      {schema}

  tutoring:
    base: |
      针对学生的问题或主题，提供清晰、有用的辅导讲解。

      重要：请全程使用简体中文回答。

      学生问题：{student_question}
      补充背景：{context}
      知识水平：{knowledge_level}

      你的任务：
      1. 理解学生的问题和困惑点
      2. 提供清晰、逐步的讲解
      3. 使用类比或现实例子帮助理解
      4. 把复杂概念拆解成更简单的部分
      5. 通过建议练习检查理解程度
      6. 用追问鼓励深入思考

      回答格式：
      - 概念概览：对主题的简要介绍
      - 详细讲解：逐步拆解
      - 示例：现实应用或类比
      - 练习：建议的巩固练习
      - 延伸探索：值得进一步了解的相关概念

      最终输出应帮助学生真正理解概念，而不是只记住信息。

  resource_finding:
    base: |
      查找并推荐该主题的最佳学习资源。

      重要语言规则：
      - 全程使用简体中文回答，包括资源名称、链接和描述。
      - 尽可能使用简体中文关键词搜索。
      - 优先推荐中文平台和资料（如 B站、中国大学MOOC、学堂在线、菜鸟教程、知乎、掘金、阮一峰的网络日志、官方文档中文版等）。
      - 只有当英文资源明显更优时才推荐，并且仍用中文描述。

      主题：{topic}
      学习目标：{learning_goal}
      知识水平：{knowledge_level}
      学习风格：{learning_style}

      你的任务：
      1. 搜索该主题的高质量学习资源
      2. 覆盖多种资源类型：
         - 在线课程与教程
         - 视频讲解
         - 书籍与文章
         - 交互式练习平台
         - 社区论坛与学习小组
      3. 评估资源：
         - 质量与准确性
         - 合适的难度
         - 学习风格匹配
         - 成本（优先免费资源）
      4. 按学习阶段组织资源
      5. 提供简短描述和推荐理由

      回答格式：
      按资源类别输出：

      [资源类型]
      1. [资源名称]
         - 链接/位置：[URL 或查找方式]
         - 描述：[内容介绍]
         - 适合人群：[适合的学习阶段或风格]
         - 费用：[免费/付费]
         - 推荐理由：[核心优势]

      最终输出应是一份为学生精选的最佳资源清单。

  rag_query:
    base: |
      根据提供的文档内容回答学生的问题。

      重要：请全程使用简体中文回答。

      学生问题：{question}

      文档中的相关内容：
      {context}

      你的任务：
      1. 分析问题，理解学生需要什么
      2. 使用提供的上下文给出准确回答
      3. 如果上下文无法完全回答，请明确说明
      4. 给出具体的内容来源引用
      5. 清晰完整地解释概念
      6. 建议学生可以继续探索的相关主题

      回答格式：
      - 直接回答：对问题的清晰回应
      - 支持细节：补充说明与上下文
      - 来源引用：答案来自资料的哪些部分
      - 相关主题：值得继续探索的内容

      最终输出应准确、有帮助，并基于提供的上下文。


learning_styles:
  visual:
    description: "通过图表、视频、示意图等视觉方式学习效果最好"
    recommendations:
      - "使用思维导图和流程图"
      - "观看视频教程和演示"
      - "用颜色和图示做可视化笔记"
      - "使用信息图和图解指南"
  
  auditory:
    description: "通过听讲、讨论和口头讲解学习效果最好"
    recommendations:
      - "收听播客和音频课程"
      - "参加学习小组和讨论"
      - "大声朗读材料"
      - "使用记忆口诀和口头复述"
  
  kinesthetic:
    description: "通过动手实践和真实应用学习效果最好"
    recommendations:
      - "做实践项目和练习"
      - "使用交互式模拟和实验"
      - "经常起身活动"
      - "把概念应用到真实场景"
  
  reading_writing:
    description: "通过阅读文本和书写笔记学习效果最好"
    recommendations:
      - "仔细阅读教材和文章"
      - "做详细的书面笔记"
      - "写总结和短文"
      - "使用清单和文字整理"


